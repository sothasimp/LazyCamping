; Wayfarer defaults for new characters and first installation into an existing playthrough.
; Defaults are read when the mod first initializes.
; Existing Wayfarer characters keep their saved settings. Menu changes never edit this file.
; Edit before starting a new character or first installing Wayfarer for that character.
; Missing/invalid entries keep the original mod defaults; invalid values are logged.
; Booleans accept true/false (case-insensitive) or 1/0. Put comments on separate lines.

[Camp]
; Tilt camp objects to match the ground.
AlignToSlope=true
; Clear grass while the camp is deployed.
HideGrassUnderCamp=true
; Fade during camp setup and pack-up.
FadeOnSetUp=false
; Allow collision with the tents' walls.
TentCollision=true
; Place tent lanterns, initially unlit.
PlaceTentLanterns=true
; Show a fast-travel map marker while the camp is deployed.
PlaceMapMarker=true
; Place a tub in the camp.
PlaceTub=true
; Requires PlaceTub. Place the tub in the large tent. Uses two bedroll spaces in the large tent.
TubInLargeTent=false

[Bedrolls]
;  Have bedrolls start rolled up.
BedrollsStartRolled=true
; Style of bedroll to use. 0=Vanilla
; Bedroll Alternative - BOS Color Variance: 1=Green, 2=Blue, 3=Red, 4=Mixed
; Ash Nomad - Bedrolls - BOS Distributed: 5=Blue, 6=Red, 7=Purple, 8=Mixed
; Without the selected style's mod, the camp uses vanilla bedrolls.
BedrollStyle=0

[Fire]
; Disabling the firepit also disables its light, cooking, firewood mechanic and chopping block.
PlaceCampfire=true
; Place the campfire outside the large tent.
FireOutsideLargeTent=false
; Brightness of the campfire. 0=Off (Use with Light Placer), 1=Dim, 2=Medium, 3=Bright. Requires PlaceCampfire.
CampfireLight=3
; Requires an enabled campfire light. Campfire casts shadows. Shadow casting costs some performance.
CampfireLightShadows=false
; Requires PlaceCampfire. Allows stews and soups at camp.
PlaceCookpot=false
; Requires PlaceCampfire. Fires start unlit and consume wood when lit.
FirewoodMechanic=false
; Game hours that the fire lasts for, 1.0 to 24.0. Requires FirewoodMechanic.
FireBurnHours=6.0
; Pieces of firewood per lighting, 1 to 6. Requires FirewoodMechanic.
FirewoodPerFire=2
; Requires PlaceCampfire and FirewoodMechanic. Place a wood chopping block.
PlaceChoppingBlock=true
; Place seats around the campfire.
PlaceFireSeats=true
; Seat colors. 0=Brown, 1=White, 2=Plaid green, 3=Plaid yellow, 4=Plaid blue. Requires PlaceFireSeats.
SeatColor=0

[LeveledLists]
; General goods merchants can stock camping kits. Changes appear at their next restock.
KitsAtMerchants=true
