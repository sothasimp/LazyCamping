name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to a pull request cancels its build that's still running.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: SKSE plugin
    runs-on: windows-latest
    defaults:
      run:
        working-directory: SKSE
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest

      - name: Cache xmake packages
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/xmake-packages
          key: xmake-${{ runner.os }}-${{ hashFiles('SKSE/xmake.lua', '.gitmodules') }}

      - name: Configure
        env:
          XMAKE_PKG_INSTALLDIR: ${{ runner.temp }}/xmake-packages
        run: xmake config -m release -y

      - name: Build
        env:
          XMAKE_PKG_INSTALLDIR: ${{ runner.temp }}/xmake-packages
        run: xmake build -y -v

      - name: Upload plugin
        uses: actions/upload-artifact@v7
        with:
          name: LazyCamping
          path: SKSE/dist/
          if-no-files-found: error

  esp-builder:
    name: Plugin builder
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Plugin
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Build the builder
        run: dotnet build -c Release

      # Skyrim.esm can't be in CI, so build against a stand-in that has just
      # the records the builder looks up. This checks the code paths, not the
      # real game data.
      - name: Make a stand-in Skyrim.esm
        run: dotnet run -c Release --no-build -- --make-test-master "$RUNNER_TEMP/Skyrim.esm"

      - name: Build LazyCamping.esp against it
        run: dotnet run -c Release --no-build -- --master "$RUNNER_TEMP/Skyrim.esm" --out "$RUNNER_TEMP/LazyCamping.esp"

      - name: Check links and script properties
        run: dotnet run -c Release --no-build -- --verify "$RUNNER_TEMP/LazyCamping.esp" --master "$RUNNER_TEMP/Skyrim.esm" --scripts ../Scripts/Source
