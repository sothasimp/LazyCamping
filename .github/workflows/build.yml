name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to a pull request cancels its build that's still running.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: SKSE plugin
    runs-on: windows-latest
    defaults:
      run:
        working-directory: SKSE
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest

      - name: Cache xmake packages
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/xmake-packages
          key: xmake-${{ runner.os }}-${{ hashFiles('SKSE/xmake.lua', '.gitmodules') }}

      - name: Configure
        env:
          XMAKE_PKG_INSTALLDIR: ${{ runner.temp }}/xmake-packages
        run: xmake config -m release -y

      - name: Build
        env:
          XMAKE_PKG_INSTALLDIR: ${{ runner.temp }}/xmake-packages
        run: xmake build -y -v

      - name: Upload plugin
        uses: actions/upload-artifact@v7
        with:
          name: LazyCamping
          path: SKSE/dist/
          if-no-files-found: error

  esp-builder:
    name: Plugin check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Plugin
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Build the builder
        run: dotnet build -c Release

      # LazyCamping.esp is edited in the Creation Kit; check its script
      # properties against the sources.
      - name: Check LazyCamping.esp's script properties
        run: dotnet run -c Release --no-build -- ../LazyCamping.esp ../Scripts/Source
